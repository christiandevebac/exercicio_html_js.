<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício HTML e JS - EBAC</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <h1>Validação Numérica</h1>
        <form id="form-numeros">
            <label for="campo-a">Campo A:</label>
            <input type="number" id="campo-a" required placeholder="Digite o número A">

            <label for="campo-b">Campo B:</label>
            <input type="number" id="campo-b" required placeholder="Digite o número B">

            <button type="submit">Validar</button>
        </form>
        <p id="mensagem"></p>
    </div>

    <script src="main.js"></script>
</body>
</html>
